<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TikTok offline</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>TikTok offline</h1>
    <input type="text" id="search" placeholder="Szukaj filmów..." />
    <div id="videoList"></div>

    <div class="upload-section">
      <h2>Dodaj swój film</h2>
      <input type="file" id="uploadInput" accept="video/*" />
      <button id="uploadBtn">Wyślij film</button>
      <p id="uploadMessage"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
